<script>window.onerror=function(m,s,l){var d=document.createElement('div');d.style.cssText='position:fixed;z-index:99;left:6px;right:6px;bottom:6px;background:#400;color:#fff;padding:8px;font:12px monospace';d.textContent='ERRO: '+m+' (linha '+l+')';(document.body||document.documentElement).append(d)}</script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--c:#35e6ff;--d:#14657a;--t:#d4f6fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#01060c;color:var(--t);font:500 15px/1.3 Rajdhani,system-ui,sans-serif}
#fx{position:fixed;inset:0;width:100%;height:100%}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.ui>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--d);background:#03121c99;padding:6px 12px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.top b{color:var(--c);letter-spacing:.25em;text-shadow:0 0 10px var(--c)}
#status{color:var(--d);letter-spacing:.1em;font-size:13px}
body:not([data-s=idle]) #status{color:var(--c)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.p{border:1px solid var(--d);background:#03121c99;padding:6px 8px;font-size:12px;letter-spacing:.06em;color:#7fbfce;position:relative}
.p::before{content:"";position:absolute;left:-1px;top:-1px;width:10px;height:10px;border-left:2px solid var(--c);border-top:2px solid var(--c)}
.p h4{margin:0 0 2px;font-size:11px;color:var(--c);letter-spacing:.2em;font-weight:600}
#hora{font-size:26px;color:var(--c);line-height:1;text-shadow:0 0 10px var(--c)}
#clm{cursor:pointer;color:var(--c);margin-top:2px}
canvas.sp{width:100%;height:20px;display:block;margin-top:3px}
#alvo{flex:1;min-height:150px;position:relative;pointer-events:none}
#interim{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#8fd8e6;font-size:17px}
#marca{position:absolute;bottom:0;left:0;font-size:11px;letter-spacing:.3em;color:var(--d);font-weight:600}
#log{max-height:22vh;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:10px 0 6px;-webkit-mask-image:linear-gradient(transparent,#000 25%);mask-image:linear-gradient(transparent,#000 25%)}
.m{padding:5px 12px;border-left:2px solid var(--c);background:linear-gradient(90deg,#0a3a4c66,transparent);max-width:92%}
.m.user{align-self:flex-end;border-left:0;border-right:2px solid var(--d);background:linear-gradient(270deg,#0a2a3a66,transparent);color:#9ccbd6;text-align:right}
.m.err{border-color:#ff6b6b;color:#ffb0b0}.m.acao{background:none}
.go{display:inline-block;color:#001018;background:var(--c);padding:6px 16px;border-radius:16px;font-weight:600;text-decoration:none}
.vazio{color:var(--d);text-align:center}
.fila{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 8px}
.bt{width:44px;height:44px;border-radius:50%;border:1px solid var(--d);background:#03101acc;color:var(--c);display:grid;place-items:center;font-size:18px;cursor:pointer;padding:0}
.bt:active{transform:scale(.94)}
#mic{width:68px;height:68px;border-color:var(--c);box-shadow:0 0 22px #35e6ff55,inset 0 0 14px #35e6ff33}
body[data-s=listening] #mic{background:var(--c);color:#001018}
.campo{display:flex;gap:8px}
#txt{flex:1;min-width:0;background:#03101acc;border:1px solid var(--d);color:var(--t);border-radius:22px;padding:10px 16px;font:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
#ajustes{display:flex;gap:14px;justify-content:center;color:var(--d);font-size:13px;margin-top:8px;flex-wrap:wrap}
#ajustes[hidden],#hub[hidden]{display:none}
#ajustes label{display:flex;gap:6px;align-items:center}
input[type=range]{accent-color:var(--c);width:80px}
#hub{position:fixed;inset:0;z-index:5;background:#01060cf5;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 30px}
.hh{display:flex;justify-content:space-between;align-items:center;color:var(--c);letter-spacing:.3em;font-weight:600;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;border:1px solid var(--d);color:var(--t);text-decoration:none;font-size:12px;background:#03121c99}
.tile i{font-style:normal;font-size:24px}
.card{margin-top:12px;border:1px solid var(--d);padding:10px;background:#03121c99}
.card h3{margin:0 0 8px;font-size:13px;letter-spacing:.2em;color:var(--c);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--d);background:none;color:var(--c);border-radius:16px;padding:6px 14px;font:inherit;cursor:pointer}
#nota{width:100%;min-height:80px;background:#02101a;border:1px solid var(--d);color:var(--t);padding:8px;font:inherit;font-size:16px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid #fff4;padding:0;cursor:pointer}
#boot{position:fixed;inset:0;z-index:9;background:#01060c;display:grid;place-content:center;color:var(--c);letter-spacing:.2em;font-size:13px;animation:sum .6s 2.2s forwards}
#boot p{margin:3px 0;opacity:0;animation:ap .4s forwards}
@keyframes ap{to{opacity:1}}@keyframes sum{to{opacity:0;visibility:hidden}}
</style></head>
<body data-s="idle">
<canvas id="fx"></canvas>
<div class="ui">
 <div class="top"><b>J.A.R.V.I.S. OS</b><span id="status">EM ESPERA</span></div>
 <div class="pn">
  <div class="p"><h4>HORA LOCAL</h4><div id="hora">--:--:--</div><div id="dt"></div><div id="clm">CLIMA ▸ TOQUE</div></div>
  <div class="p"><h4>SISTEMA</h4><div id="sys"></div><canvas class="sp" id="sp"></canvas></div>
 </div>
 <div id="alvo"><div id="interim"></div><div id="marca">STARK INDUSTRIES</div></div>
 <div id="log"><div class="vazio" id="vazio">Toque no microfone ou digite um comando.</div></div>
 <div class="fila">
  <button class="bt" id="cfg" aria-label="Ajustes">⚙</button>
  <button class="bt" id="hubb" aria-label="Arsenal">▦</button>
  <button class="bt" id="mic" aria-label="Falar"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button class="bt" id="parar" aria-label="Interromper"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg></button>
 </div>
 <div class="campo"><input type="text" id="txt" placeholder="Ex.: abre o Spotify, toca Legião Urbana" maxlength="2000" autocomplete="off"><button class="bt" id="enviar" aria-label="Enviar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
 <div id="ajustes" hidden><label>Volume <input type="range" id="vol" min="0" max="1" step="0.05" value="1"></label><label>Velocidade <input type="range" id="vel" min="0.7" max="1.2" step="0.05" value="1"></label><label><input type="checkbox" id="vl" checked> Voz nos atalhos</label></div>
</div>
<section id="hub" hidden>
 <div class="hh"><span>ARSENAL</span><button class="bt" id="fecha" aria-label="Fechar">✕</button></div>
 <div class="grid" id="apps"></div>
 <div class="card"><h3>ATALHOS</h3><div class="row"><button class="chip" data-c="clima">Clima</button><button class="chip" data-c="que horas são">Horas</button><button class="chip" data-c="timer 1 minuto">Timer 1 min</button><button class="chip" data-c="timer 5 minutos">Timer 5 min</button><button class="chip" data-c="bateria">Bateria</button><button class="chip" data-c="ajuda">Ajuda</button></div></div>
 <div class="card"><h3>NOTAS</h3><textarea id="nota" placeholder="Salva neste aparelho. Diga: anota comprar pão"></textarea></div>
 <div class="card"><h3>INTERFACE</h3><div class="row" id="temas"></div></div>
</section>
<div id="boot"><div><p>INICIALIZANDO NÚCLEO…</p><p style="animation-delay:.5s">CARREGANDO PROTOCOLOS…</p><p style="animation-delay:1s">ARSENAL: ONLINE</p><p style="animation-delay:1.5s">BEM-VINDO, SENHOR.</p></div></div>
<script>
const $=s=>document.querySelector(s),SR=window.SpeechRecognition||window.webkitSpeechRecognition,q=encodeURIComponent;
const nomes={idle:'EM ESPERA',listening:'OUVINDO',thinking:'PROCESSANDO',speaking:'FALANDO'};
let historico=[],estado='idle',rec=null,ctrl=null,ac=null,an=null,dados=null,bat='',nivel=0,COR='53,230,255',fps=60,lat='--';
const ha=[],audio=new Audio();
const pk=p=>'intent://#Intent;package='+p+';end',st=a=>'intent:#Intent;action=android.settings.'+a+';end';
const APPS=[['Spotify','🎵',pk('com.spotify.music'),'spotify|musica'],['YouTube','▶️',pk('com.google.android.youtube'),'youtube|yt'],
['WhatsApp','💬',pk('com.whatsapp'),'whatsapp|zap'],['Instagram','📸',pk('com.instagram.android'),'instagram|insta'],
['Maps','🗺️',pk('com.google.android.apps.maps'),'maps|mapa|mapas'],['Waze','🚗',pk('com.waze'),'waze'],
['Gmail','✉️',pk('com.google.android.gm'),'gmail|email'],['Telegram','✈️',pk('org.telegram.messenger'),'telegram'],
['Netflix','🎬',pk('com.netflix.mediaclient'),'netflix'],['TikTok','🎶',pk('com.zhiliaoapp.musically'),'tiktok'],
['Uber','🚕',pk('com.ubercab'),'uber'],['iFood','🍔','https://www.ifood.com.br','ifood'],
['Play Store','🛍️',pk('com.android.vending'),'play store|loja'],['Fotos','🖼️',pk('com.google.android.apps.photos'),'fotos|galeria'],
['Drive','📁',pk('com.google.android.apps.docs'),'drive'],['Agenda','📅',pk('com.google.android.calendar'),'agenda|calendario'],
['Claude','🤖',pk('com.anthropic.claude'),'claude'],['Câmera','📷','intent:#Intent;action=android.media.action.IMAGE_CAPTURE;end','camera'],
['Telefone','📞','tel:','telefone|discador'],['Config.','⚙️',st('SETTINGS'),'configuracoes|configuracao|ajustes'],
['Wi-Fi','📶',st('WIFI_SETTINGS'),'wifi|wi fi'],['Bluetooth','🔵',st('BLUETOOTH_SETTINGS'),'bluetooth'],
['GitHub','🐙','https://github.com','github'],['Render','☁️','https://dashboard.render.com','render']];
const CORES={azul:'#35e6ff',vermelho:'#ff4455',dourado:'#ffc233',verde:'#3dff9a',roxo:'#b066ff',laranja:'#ff8a33'};
function tema(h){COR=parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);document.documentElement.style.setProperty('--c',h);try{localStorage.jv_tema=h}catch(e){}}
try{if(localStorage.jv_tema)tema(localStorage.jv_tema)}catch(e){}

/* ---------- Reator Arc (canvas 2D) ---------- */
const cv=$('#fx'),x=cv.getContext('2d');let dpr=1;
function dim(){dpr=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;const s=$('#sp');s.width=s.clientWidth*dpr;s.height=s.clientHeight*dpr}
addEventListener('resize',dim);dim();
function arc(cx,cy,r,a0,a1,lw,al){x.beginPath();x.arc(cx,cy,r,a0,a1);x.lineWidth=lw*dpr;x.strokeStyle='rgba('+COR+','+al+')';x.stroke()}
function tri(cx,cy,r,rot){x.beginPath();for(let i=0;i<3;i++){const a=rot+i*2.0944-1.5708,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}
function spark(){const c=$('#sp'),g=c.getContext('2d'),w=c.width,h=c.height;g.clearRect(0,0,w,h);g.strokeStyle='rgb('+COR+')';g.lineWidth=dpr;g.beginPath();ha.forEach((v,i)=>{const px=i/59*w,py=h-Math.min(1,v)*(h-2)-1;i?g.lineTo(px,py):g.moveTo(px,py)});g.stroke()}
let ang=0,t0=performance.now(),fr=0,tf=t0,ta=t0;
function quadro(now){requestAnimationFrame(quadro);
 const dt=Math.min((now-t0)/1000,.05),t=now/1000;t0=now;fr++;
 if(now-tf>1000){fps=fr;fr=0;tf=now}
 let alvo=.05+.03*Math.sin(t*1.5);
 if(estado=='listening')alvo=.25+.12*Math.sin(t*7);else if(estado=='thinking')alvo=.3+.1*Math.sin(t*12);
 else if(estado=='speaking'){if(an&&dados){an.getByteFrequencyData(dados);let m=0;for(let i=0;i<dados.length;i++)m+=dados[i];alvo=Math.min(1,m/dados.length/100)}else alvo=.4+.3*Math.abs(Math.sin(t*9))}
 nivel+=(alvo-nivel)*Math.min(1,dt*10);
 if(now-ta>300){ta=now;ha.push(nivel);if(ha.length>60)ha.shift();spark()}
 const W=cv.width,H=cv.height,r0=$('#alvo').getBoundingClientRect(),cx=(r0.left+r0.width/2)*dpr,cy=(r0.top+r0.height/2)*dpr,R=Math.min(r0.width*.47,r0.height*.5,190)*dpr;
 x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
 x.strokeStyle='rgba('+COR+',.05)';x.lineWidth=dpr;x.beginPath();
 for(let g=0;g<W;g+=40*dpr){x.moveTo(g,0);x.lineTo(g,H)}for(let g=0;g<H;g+=40*dpr){x.moveTo(0,g);x.lineTo(W,g)}x.stroke();
 const vel=estado=='thinking'?3:estado=='listening'?1.6:1;ang+=dt*vel;
 const gl=x.createRadialGradient(cx,cy,0,cx,cy,R*(1+nivel*.4));
 gl.addColorStop(0,'rgba('+COR+','+(.35+nivel*.4)+')');gl.addColorStop(.55,'rgba('+COR+',.08)');gl.addColorStop(1,'rgba('+COR+',0)');
 x.fillStyle=gl;x.fillRect(cx-R*1.5,cy-R*1.5,R*3,R*3);
 x.save();x.translate(cx,cy);x.rotate(ang*.15);x.strokeStyle='rgba('+COR+',.75)';x.lineWidth=dpr;x.beginPath();
 for(let i=0;i<72;i++){const a=i*Math.PI/36,l=i%6?.03:.07;x.moveTo(Math.cos(a)*R,Math.sin(a)*R);x.lineTo(Math.cos(a)*R*(1-l),Math.sin(a)*R*(1-l))}
 x.stroke();x.restore();
 arc(cx,cy,R,0,6.283,1,.5);
 for(let i=0;i<10;i++){const a=-ang*.4+i*.628;arc(cx,cy,R*.86,a,a+.5,5,.5+nivel*.4)}
 x.fillStyle='rgba('+COR+',.9)';
 for(let k=0;k<4;k++){const a=ang*.3+k*1.5708,s=5*dpr;x.fillRect(cx+Math.cos(a)*R*.93-s/2,cy+Math.sin(a)*R*.93-s/2,s,s)}
 arc(cx,cy,R*.76,0,6.283,1,.35);
 arc(cx,cy,R*.7,ang*.8,ang*.8+2.2,3,.85);arc(cx,cy,R*.7,ang*.8+3.4,ang*.8+4.6,3,.85);
 x.globalCompositeOperation='source-over';x.fillStyle='rgba(1,10,18,.8)';x.beginPath();x.arc(cx,cy,R*.62,0,6.283);x.fill();x.globalCompositeOperation='lighter';
 arc(cx,cy,R*.62,0,6.283,2,.7);
 tri(cx,cy,R*.52,Math.PI);x.lineWidth=3*dpr;x.strokeStyle='rgba('+COR+',.85)';x.stroke();
 const k=1+nivel*.18;tri(cx,cy,R*.36*k,Math.PI);x.fillStyle='rgba('+COR+','+(.3+nivel*.5)+')';x.fill();x.lineWidth=2*dpr;x.strokeStyle='rgba('+COR+',1)';x.stroke();
 const cg=x.createRadialGradient(cx,cy,0,cx,cy,R*.2*(1+nivel));cg.addColorStop(0,'rgba(255,255,255,.95)');cg.addColorStop(1,'rgba('+COR+',0)');
 x.fillStyle=cg;x.beginPath();x.arc(cx,cy,R*.2*(1+nivel),0,6.283);x.fill();
 x.globalCompositeOperation='source-over'}
requestAnimationFrame(quadro);

/* ---------- Painéis ---------- */
navigator.getBattery?.().then(b=>{const f=()=>{bat=Math.round(b.level*100)+'%'+(b.charging?'⚡':'')};f();b.onlevelchange=b.onchargingchange=f}).catch(()=>{});
function painel(){const d=new Date();$('#hora').textContent=d.toLocaleTimeString('pt-BR');
 $('#dt').textContent=d.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'}).toUpperCase();
 $('#sys').innerHTML='BAT '+(bat||'--')+' · REDE '+(navigator.onLine?(navigator.connection?.effectiveType||'ON').toUpperCase():'OFF')+'<br>NÚCLEOS '+(navigator.hardwareConcurrency||'--')+' · RAM '+(navigator.deviceMemory||'--')+'GB<br>FPS '+fps+' · LAT '+lat}
setInterval(painel,1000);painel();

/* ---------- Áudio e conversa ---------- */
function iniciarAudio(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=64;const s=ac.createMediaElementSource(audio);s.connect(an);an.connect(ac.destination);dados=new Uint8Array(an.frequencyBinCount)}if(ac.state=='suspended')ac.resume()}catch(e){}}
function setEstado(s){estado=s;document.body.dataset.s=s;$('#status').textContent=nomes[s]}
function add(cls,t){$('#vazio')?.remove();const d=document.createElement('div');d.className='m '+cls;d.textContent=t;$('#log').append(d);$('#log').scrollTop=1e9}
function acao(rot,url){$('#vazio')?.remove();const d=document.createElement('div'),a=document.createElement('a');d.className='m acao';a.className='go';a.href=url;a.textContent='ABRIR ▸ '+rot;if(/^https?:/.test(url))a.target='_blank';d.append(a);$('#log').append(d);$('#log').scrollTop=1e9;
 try{/^https?:/.test(url)?window.open(url,'_blank'):location.href=url}catch(e){}}
function parar(s){ctrl?.abort();ctrl=null;audio.pause();if(rec){rec.onend=rec.onerror=null;rec.abort();rec=null}$('#interim').textContent='';if(!s)setEstado('idle')}
async function dizer(t){add('assistant',t);if(!$('#vl').checked){setEstado('idle');return 1}
 ctrl=new AbortController();setEstado('thinking');try{await falar(t)}catch(e){setEstado('idle')}return 1}
async function perguntar(texto){
 texto=texto.trim();if(!texto)return;parar(true);add('user',texto);
 try{if(await cmd(texto))return}catch(e){add('err','Não consegui executar: '+e.message);setEstado('idle');return}
 historico.push({role:'user',content:texto});setEstado('thinking');ctrl=new AbortController();const t1=performance.now();
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:historico.slice(-20)}),signal:ctrl.signal});
  const j=await r.json();if(!r.ok)throw new Error(j.error||'Falha na resposta.');lat=Math.round(performance.now()-t1)+'ms';
  historico.push({role:'assistant',content:j.text});add('assistant',j.text);await falar(j.text)}
 catch(e){if(e.name=='AbortError')return;if(historico.at(-1)?.role=='user')historico.pop();add('err',e.message);setEstado('idle')}}
async function falar(texto){
 const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:texto,speed:+$('#vel').value}),signal:ctrl?.signal});
 if(!r.ok){const j=await r.json().catch(()=>({}));add('err',j.error||'Falha ao gerar a voz.');setEstado('idle');return}
 const url=URL.createObjectURL(await r.blob());audio.src=url;audio.volume=+$('#vol').value;
 audio.onended=()=>{URL.revokeObjectURL(url);setEstado('idle')};
 if(ac&&ac.state=='suspended')await ac.resume().catch(()=>{});setEstado('speaking');
 await audio.play().catch(()=>{add('err','O navegador bloqueou o áudio. Toque no microfone e tente de novo.');setEstado('idle')})}

/* ---------- Comandos locais ---------- */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[?!.,;-]/g,' ').replace(/\s+/g,' ').trim();
const app=s=>{s=' '+s+' ';return APPS.find(a=>a[3].split('|').some(k=>s.includes(' '+k+' ')))};
const go=(rot,url,fala)=>{acao(rot,url);return dizer(fala)};
let tim,fim;const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function bip(){try{const c=new AudioContext();[0,.35,.7].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start(c.currentTime+d);o.stop(c.currentTime+d+.2)})}catch(e){}}
function timer(s){clearInterval(tim);fim=Date.now()+s*1e3;tim=setInterval(()=>{const r=Math.ceil((fim-Date.now())/1e3);$('#clm').textContent=r>0?'TEMPORIZADOR '+fmt(r):'CLIMA ▸ TOQUE';if(r<=0){clearInterval(tim);bip();dizer('O tempo acabou, senhor.')}},500)}
async function clima(){
