<script>

['WhatsApp','💬',pk('com.whatsapp'),'whatsapp|zap'],['Instagram','📸',pk('com.instagram.android'),'instagram|insta'],

['Drive','📁',pk('com.google.android.apps.docs'),'drive'],['Agenda','📅',pk('com.google.android.calendar'),'agenda|calendario'],
['Claude','🤖',pk('com.anthropic.claude'),'claude'],['Câmera','📷','intent:#Intent;action=android.media.action.IMAGE_CAPTURE;end','camera'],
['Telefone','📞','tel:','telefone|discador'],['Config.','⚙️',st('SETTINGS'),'configuracoes|configuracao|ajustes'],
['Wi-Fi','📶',st('WIFI_SETTINGS'),'wifi|wi fi'],['Bluetooth','🔵',st('BLUETOOTH_SETTINGS'),'bluetooth'],
['GitHub','🐙','https://github.com','github'],['Render','☁️','https://dashboard.render.com','render']];

/* ---------- Cena 3D ---------- */
function cena(){
 const R=new THREE.WebGLRenderer({canvas:$('#cena'),alpha:true,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
 const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(50,1,.1,60),mundo=new THREE.Group(),orb=new THREE.Group();S.add(mundo);mundo.add(orb);
 const ADD=THREE.AdditiveBlending,N=1800,pos0=new Float32Array(N*3),fase=new Float32Array(N),ga=Math.PI*(3-Math.sqrt(5));
 for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=ga*i;pos0.set([Math.cos(a)*r,y,Math.sin(a)*r],i*3);fase[i]=Math.random()*6.283}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));
 const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0x35e6ff,size:.05,transparent:true,opacity:.95,blending:ADD,depthWrite:false}));orb.add(pts);
 const wire=new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(1.6,1)),new THREE.LineBasicMaterial({color:0x35e6ff,transparent:true,opacity:.13,blending:ADD}));orb.add(wire);
 const nucleo=new THREE.Mesh(new THREE.SphereGeometry(.36,24,24),new THREE.MeshBasicMaterial({color:0xbff8ff,transparent:true,opacity:.9}));orb.add(nucleo);
 const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
 g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.35,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);
 const brilho=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),color:0x35e6ff,blending:ADD,transparent:true,depthWrite:false}));mundo.add(brilho);
 const aneis=[[1.95,.008,6.283,[1.2,0,0],.35],[2.3,.006,4.2,[.4,.9,0],-.5],[2.65,.01,3.1,[-.9,.3,0],.25],[3,.005,5.2,[.2,-.6,.8],-.18]].map(([r,t,arc,rot,v])=>{
  const m=new THREE.Mesh(new THREE.TorusGeometry(r,t,6,120,arc),new THREE.MeshBasicMaterial({color:0x35e6ff,transparent:true,opacity:.65,blending:ADD,depthWrite:false}));m.rotation.set(...rot);m.userData.v=v;orb.add(m);return m});
 const np=500,pp=new Float32Array(np*3);
 for(let i=0;i<np;i++){const r=5+Math.random()*8,a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);pp.set([r*Math.sin(b)*Math.cos(a),r*Math.sin(b)*Math.sin(a),r*Math.cos(b)],i*3)}
 const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
 const poeira=new THREE.Points(pg,new THREE.PointsMaterial({color:0x35e6ff,size:.04,transparent:true,opacity:.35,blending:ADD,depthWrite:false}));S.add(poeira);
 const branco=new THREE.Color(0xffffff),tint=[pts,wire,poeira,brilho,...aneis].map(o=>o.material);
 window.setAcento=h=>{tint.forEach(m=>m.color.setHex(h));nucleo.material.color.setHex(h).lerp(branco,.75)};
 let esc=1,mx=0,my=0,nivel=0,t0=performance.now();
 addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
 function ajustar(){const w=innerWidth,h=innerHeight,p=w/h<.8;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix();C.position.z=p?8.5:6.5;esc=p?.7:1;orb.scale.setScalar(esc);mundo.position.y=p?1.1:.2}
 addEventListener('resize',ajustar);ajustar();
 function quadro(now){requestAnimationFrame(quadro);
  const dt=Math.min((now-t0)/1000,.05),t=now/1000;t0=now;let alvo=.06+.03*Math.sin(t*1.5);
  if(estado=='listening')alvo=.25+.12*Math.sin(t*7);else if(estado=='thinking')alvo=.3+.1*Math.sin(t*12);
  else if(estado=='speaking'){if(an&&dados){an.getByteFrequencyData(dados);let m=0;for(let i=0;i<dados.length;i++)m+=dados[i];alvo=Math.min(1,m/dados.length/100)}else alvo=.4+.3*Math.abs(Math.sin(t*9))}
  nivel+=(alvo-nivel)*Math.min(1,dt*10);
  const vel=estado=='thinking'?3.2:estado=='listening'?1.5:1;
  orb.rotation.y+=dt*.25*vel;orb.rotation.x=Math.sin(t*.3)*.12+my*.4;mundo.rotation.y=mx*.4;
  aneis.forEach(a=>{a.rotation.z+=a.userData.v*dt*vel*(1+nivel*2)});
  const a=geo.attributes.position.array;
  for(let i=0;i<N;i++){const r=1.3+.03*Math.sin(fase[i]+t*2)+nivel*.38*Math.sin(fase[i]*3+t*10);a[i*3]=pos0[i*3]*r;a[i*3+1]=pos0[i*3+1]*r;a[i*3+2]=pos0[i*3+2]*r}
  geo.attributes.position.needsUpdate=true;
  nucleo.scale.setScalar(1+nivel*.9);nucleo.material.opacity=.6+nivel*.4;brilho.scale.setScalar((3.8+nivel*3.2)*esc);poeira.rotation.y+=dt*.02;R.render(S,C)}
 requestAnimationFrame(quadro)}
try{if(window.THREE)cena()}catch(e){console.warn(e)}

try{if(localStorage.jv_tema)tema(localStorage.jv_tema)}catch(e){}

function relogio(){const d=new Date();$('#hora').textContent=d.toLocaleTimeString('pt-BR');$('#dt').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}).toUpperCase()}

/* ---------- Áudio, conversa ---------- */
function iniciarAudio(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=64;const s=ac.createMediaElementSource(audio);s.connect(an);an.connect(ac.destination);dados=new Uint8Array(an.frequencyBinCount)}if(ac.state=='suspended')ac.resume()}catch(e){}}
function setEstado(s){estado=s;document.body.dataset.s=s;$('#status').textContent=nomes[s]}
function add(cls,t){$('#vazio')?.remove();const d=document.createElement('div');d.className='m '+cls;d.textContent=t;$('#log').append(d);$('#log').scrollTop=1e9}
function acao(rot,url){$('#vazio')?.remove();const d=document.createElement('div'),a=document.createElement('a');d.className='m acao';a.className='go';a.href=url;a.textContent='ABRIR ▸ '+rot;if(/^https?:/.test(url))a.target='_blank';d.append(a);$('#log').append(d);$('#log').scrollTop=1e9;
 try{/^https?:/.test(url)?window.open(url,'_blank'):location.href=url}catch(e){}}
function parar(s){ctrl?.abort();ctrl=null;audio.pause();if(rec){rec.onend=rec.onerror=null;rec.abort();rec=null}$('#interim').textContent='';if(!s)setEstado('idle')}
async function dizer(t){add('assistant',t);if(!$('#vl').checked){setEstado('idle');return 1}
 ctrl=new AbortController();setEstado('thinking');try{await falar(t)}catch(e){setEstado('idle')}return 1}
async function perguntar(texto){
 texto=texto.trim();if(!texto)return;parar(true);add('user',texto);
 try{if(await cmd(texto))return}catch(e){add('err','Não consegui executar: '+e.message);setEstado('idle');return}
 historico.push({role:'user',content:texto});setEstado('thinking');ctrl=new AbortController();
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:historico.slice(-20)}),signal:ctrl.signal});
  const j=await r.json();if(!r.ok)throw new Error(j.error||'Falha na resposta.');
  historico.push({role:'assistant',content:j.text});add('assistant',j.text);await falar(j.text)}
 catch(e){if(e.name=='AbortError')return;if(historico.at(-1)?.role=='user')historico.pop();add('err',e.message);setEstado('idle')}}
async function falar(texto){
 const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:texto,speed:+$('#vel').value}),signal:ctrl?.signal});
 if(!r.ok){const j=await r.json().catch(()=>({}));add('err',j.error||'Falha ao gerar a voz.');setEstado('idle');return}
 const url=URL.createObjectURL(await r.blob());audio.src=url;audio.volume=+$('#vol').value;
 audio.onended=()=>{URL.revokeObjectURL(url);setEstado('idle')};
 if(ac&&ac.state=='suspended')await ac.resume().catch(()=>{});setEstado('speaking');
 await audio.play().catch(()=>{add('err','O navegador bloqueou o áudio. Toque no microfone e tente de novo.');setEstado('idle')})}

/* ---------- Comandos locais ---------- */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[?!.,;-]/g,' ').replace(/\s+/g,' ').trim();
const app=s=>{s=' '+s+' ';return APPS.find(a=>a[3].split('|').some(k=>s.includes(' '+k+' ')))};
const go=(rot,url,fala)=>{acao(rot,url);return dizer(fala)};
let tim,fim;const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function bip(){try{const c=new AudioContext();[0,.35,.7].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start(c.currentTime+d);o.stop(c.currentTime+d+.2)})}catch(e){}}
function timer(s){clearInterval(tim);fim=Date.now()+s*1e3;tim=setInterval(()=>{const r=Math.ceil((fim-Date.now())/1e3);$('#tm').textContent=r>0?'TEMPORIZADOR '+fmt(r):'';if(r<=0){clearInterval(tim);bip();dizer('O tempo acabou, senhor.')}},500)}
async function clima(){

 const d=(await(await fetch('https://api.open-meteo.com/v1/forecast?latitude='+p.coords.latitude+'&longitude='+p.coords.longitude+'&current=temperature_2m,apparent_temperature,weather_code&timezone=auto')).json()).current,c=d.weather_code;
 const w=c==0?'céu limpo':c<4?'parcialmente nublado':c<50?'neblina':c<7
